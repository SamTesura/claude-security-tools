services:
  mcp-security:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-security-server

    user: "0:0"

    # Least-privilege capability set. nmap SYN/UDP/OS scans need only CAP_NET_RAW;
    # nothing in the toolchain needs SYS_ADMIN/SYS_PTRACE/NET_ADMIN/NET_BIND_SERVICE.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      # Root also needs DAC_OVERRIDE to write the bind-mounted ./data dir, which
      # is owned by the host user, not the container's root. Without it,
      # cap_drop: ALL makes init_storage() fail with "unable to open database
      # file" the first time it creates scans.db (notably on Docker Desktop/WSL).
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true

    environment:
      - SCAN_DB_PATH=/data/scans.db
      - RESULTS_PATH=/data/results
      - WPSCAN_API_TOKEN=${WPSCAN_API_TOKEN:-}
      - MCP_SCOPE_FILE=/etc/mcp/scope.json

    volumes:
      - ./data:/data
      - ./wordlists:/usr/share/wordlists/custom:ro
      # The scope allowlist is baked into the image at /etc/mcp/scope.json (see
      # the Dockerfile). Single-file bind mounts are unreliable on Docker
      # Desktop + WSL2 — they can surface as an empty file — so scope.json is
      # NOT mounted by default. To use a custom out-of-tree allowlist, mount a
      # DIRECTORY that contains a scope.json onto /etc/mcp, e.g.:
      #   - /home/you/engagements:/etc/mcp:ro
    
    # Host networking is an intentional choice for a pentest box (LAN scanning,
    # source-IP fidelity, reverse-shell catchers). It also exposes host loopback
    # services to the container — acceptable given the container is operator-run
    # and no longer privileged. Switch to a bridge network if you don't need it.
    network_mode: host

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    restart: unless-stopped

    # No healthcheck: the MCP server is a stdio process launched on demand via
    # `docker exec`, not a persistent listener, so there is nothing meaningful to
    # probe. A "python3 exit 0" check only ever reports green and hides a wedged
    # server. The container's job here is just to stay alive for exec.

    stdin_open: true
    tty: true

    command: tail -f /dev/null

volumes:
  data:
    driver: local